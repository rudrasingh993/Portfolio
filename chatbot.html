<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with RudraBot</title>
    <meta name="description" content="Chat with RudraBot, the AI assistant for Rudra Pratap Singh's portfolio.">
    <meta name="theme-color" content="#fdfcfb">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Prism.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/toolbar/prism-toolbar.min.css">

    <link rel="stylesheet" href="chatbot.css">
</head>

<body>

    <nav class="navbar" id="navbar">
        <div class="nav-content">
            <div class="logo">
                <div class="logo-sketch">
                    <span class="logo-text">Portfolio</span>
                    <div class="underline-sketch"></div>
                </div>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="index.html#home" class="nav-link">
                    <span class="link-text">Home</span>
                    <div class="link-doodle"></div>
                </a>
                <a href="index.html#about" class="nav-link">
                    <span class="link-text">About</span>
                    <div class="link-doodle"></div>
                </a>
                <a href="index.html#projects" class="nav-link">
                    <span class="link-text">Projects</span>
                    <div class="link-doodle"></div>
                </a>
                <a href="index.html#skills" class="nav-link">
                    <span class="link-text">Skills</span>
                    <div class="link-doodle"></div>
                </a>
                <a href="index.html#contact" class="nav-link">
                    <span class="link-text">Contact</span>
                    <div class="link-doodle"></div>
                </a>
                <a href="FLUID.html" class="nav-link" target="_blank">
                    <span class="link-text">Fluid Animation</span>
                    <div class="link-doodle"></div>
                </a>
                <a href="chatbot.html" class="nav-link active">
                    <span class="link-text">Chatbot</span>
                    <div class="link-doodle"></div>
                </a>
            </div>
            <div class="nav-right">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <div class="toggle-inner">
                        <i class="fas fa-sun light-icon"></i>
                        <i class="fas fa-moon dark-icon"></i>
                    </div>
                </button>
                <div class="hamburger" id="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Background Elements similar to main page -->
    <div class="paper-texture"></div>
    <div class="art-elements">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
    </div>

    <div class="page-content">
        <h1>RudraBot AI</h1>
        <p>Your personal assistant for exploring Rudra's portfolio.</p>
        <button class="btn btn-primary chat-trigger-btn" onclick="document.getElementById('chatIcon').click()">
            Start Chatting
        </button>
    </div>

    <!-- Chatbot Container -->
    <div class="chatbot-container">
        <div class="chat-icon" id="chatIcon">
            <i class="fas fa-robot"></i>
        </div>
        <div class="chat-window" id="chatWindow">
            <div class="chat-header">
                <h4 class="chat-title">RudraBot</h4>
                <div class="chat-header-buttons">
                    <button id="chatClear" class="chat-header-btn" aria-label="Clear History">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20"
                            height="20">
                            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z">
                            </path>
                        </svg>
                    </button>
                    <button id="chatClose" class="chat-header-btn" aria-label="Close Chat">&times;</button>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages">
            </div>
            <div class="chat-suggestions" id="chatSuggestions">
            </div>
            <div class="chat-input-container">
                <input type="text" id="chatInput" placeholder="Ask me something...">
                <button id="chatSend">Send</button>
            </div>
        </div>
    </div>

    <!-- Prism.js Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/toolbar/prism-toolbar.min.js"></script>

    <!-- Main Chatbot Script -->
    <script src="chatbot-standalone.js"></script>
</body>

</html>
